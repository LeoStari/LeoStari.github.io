<!DOCTYPE html>
<html lang="en">
<head>
  <script src="Core6K.js"></script>
<meta charset="UTF-8">
<style>
  body {
    background-color: #0b0c10;
    color: #c5c6c7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* =========================================================
     BACKGROUND ANIMATION — ENERGY OPTIMIZED
  ========================================================= */
  #background {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 1;
    pointer-events: none;
  }

  .bg-word {
    position: absolute;
    color: #ffffff;
    white-space: nowrap;
    animation-name: moveLeft;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    animation-duration: 25s;
    user-select: none;
    transform: translateZ(0);
  }

  @keyframes moveLeft {
    from { transform: translateX(100vw) translateZ(0); }
    to { transform: translateX(-20vw) translateZ(0); }
  }

  /* =========================================================
     CLOCK / DATE — Top-right corner
  ========================================================= */
  #clock-date {
    position: fixed;
    top: 1.2rem;
    right: 2rem;
    z-index: 100;
    font-size: 1rem;
    color: rgba(197, 198, 199, 0.5);
    letter-spacing: 0.08em;
    text-align: right;
    line-height: 1.6;
    pointer-events: none;
    user-select: none;
  }

  #clock-date .time {
    font-size: 1.4rem;
    font-weight: 700;
    color: rgba(197, 198, 199, 0.65);
  }

  @media (max-width: 768px) {
    #clock-date { font-size: 0.9rem; top: 0.8rem; right: 1rem; }
    #clock-date .time { font-size: 1.15rem; }
  }

  /* =========================================================
     FOREGROUND LAYOUT
  ========================================================= */
  #foreground {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 2rem;
    padding-bottom: 4rem;
    overflow-y: auto;
  }

  .main-card {
    background: rgba(31, 40, 51, 0.92);
    border: 1px solid #45a29e;
    border-radius: 18px;
    padding: 2rem 2.5rem;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    animation: fadeIn 0.4s ease-out;
    width: min(920px, 95%);
    box-sizing: border-box;
  }

  .reading { font-size: 1.5rem; color: #a0a0a0; margin-bottom: 0.3rem; }
  .kanji {
    font-size: clamp(3rem, 7vw, 5rem);
    font-weight: bold;
    letter-spacing: 0.15rem;
    margin: 0;
    color: #ffffff;
    line-height: 1.1;
  }
  .meaning { font-size: 1.4rem; color: #66fcf1; margin-top: 1rem; line-height: 1.5; }

  /* =========================================================
     META TAGS & DETAILS
  ========================================================= */
  .meta-tags {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 0.5rem; margin-top: 1rem;
  }

  .meta-tag {
    display: inline-flex; align-items: center;
    border: 1px solid rgba(69, 162, 158, 0.7);
    background: rgba(69, 162, 158, 0.15);
    color: #c5c6c7; border-radius: 999px;
    padding: 0.3rem 0.75rem; font-size: 0.8rem;
    line-height: 1.2; white-space: nowrap;
  }

  .detail-grid {
    display: grid; grid-template-columns: 1fr;
    gap: 1rem; margin-top: 1.4rem; width: 100%;
  }

  .detail-section {
    background: rgba(11, 12, 16, 0.4);
    border: 1px solid rgba(197, 198, 199, 0.2);
    border-radius: 12px; padding: 1rem 1.1rem;
    text-align: left;
  }

  .detail-title {
    font-size: 0.8rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: #45a29e;
    font-weight: 700; margin-bottom: 0.8rem;
  }

  .sense {
    padding-bottom: 1rem; margin-bottom: 1rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .sense:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .sense-pos { color: #66fcf1; font-weight: 700; margin-bottom: 0.35rem; line-height: 1.4; }
  .sense-defs { color: #ffffff; line-height: 1.6; font-size: 1rem; }
  .sense-notes { margin-top: 0.5rem; color: #a0a0a0; font-size: 0.92rem; line-height: 1.5; }

  .inline-list { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .inline-chip {
    border: 1px solid rgba(197, 198, 199, 0.25);
    border-radius: 999px; padding: 0.28rem 0.7rem;
    font-size: 0.84rem; line-height: 1.3;
    color: #ffffff; background: rgba(255, 255, 255, 0.03);
  }

  /* =========================================================
     KANJI CARDS
  ========================================================= */
  .kanji-cards-container {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 1.5rem; width: 100%; max-width: 1200px;
    animation: fadeIn 0.6s ease-out;
  }

  .k-card {
    background: rgba(11, 12, 16, 0.95);
    border: 1px solid #c5c6c7; border-radius: 14px;
    padding: 1.5rem; width: min(320px, 95vw);
    box-sizing: border-box; text-align: left;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
  }

  .k-char-title { font-size: 3.5rem; font-weight: bold; color: #ffffff; text-align: center; margin-bottom: 0.4rem; line-height: 1.1; }
  .k-stat { font-size: 0.95rem; color: #45a29e; text-align: center; font-weight: bold; margin-bottom: 0.2rem; }
  .k-freq { font-size: 0.82rem; color: #a0a0a0; text-align: center; margin-bottom: 1.3rem; }
  .k-section { font-size: 1rem; line-height: 1.5; margin-bottom: 0.9rem; }
  .k-label { color: #888; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 0.2rem; }
  .k-value { color: #ffffff; font-size: 1.05rem; }
  .compounds-list { margin: 0.5rem 0 0 0; padding-left: 1.2rem; color: #c5c6c7; font-size: 0.95rem; line-height: 1.5; }

  /* SCROLLBAR & ANIMATIONS */
  #foreground::-webkit-scrollbar { width: 8px; }
  #foreground::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); }
  #foreground::-webkit-scrollbar-thumb { background: rgba(69, 162, 158, 0.45); border-radius: 999px; }
  #foreground::-webkit-scrollbar-thumb:hover { background: rgba(69, 162, 158, 0.7); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 768px) {
    #foreground { padding: 1rem; gap: 1.2rem; }
    .main-card { padding: 1.4rem; }
    .reading { font-size: 1.2rem; }
    .meaning { font-size: 1.1rem; }
    .k-card { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-word, .main-card, .kanji-cards-container { animation-duration: 0.1s !important; }
  }
</style>
</head>
<body>

  <div id="background"></div>
  <div id="foreground"></div>

  <!-- Clock / Date display -->
  <div id="clock-date">
    <div class="time" id="clock-time">--:--:--</div>
    <div id="clock-date-text">---</div>
  </div>

<script>
  // =========================================================
  // GLOBALS
  // =========================================================
  let rawWordList = [];
  const dictionaryCache = {};
  const kanjiCache = {};
  let refreshCounter = 0;
  let hasRenderedOnce = false;

  const MAX_BG_WORDS = 8;
  let currentBgWordCount = 0;

  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock-time').textContent = `${hours}:${minutes}`;

    const options = { year: 'numeric', month: 'short', day: 'numeric' };
    document.getElementById('clock-date-text').textContent = now.toLocaleDateString('en-US', options);
  }

  updateClock();
  setInterval(updateClock, 30000);

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>\"']/g, (m) => ({
      '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#39;'
    }[m]));
  }

  function uniq(arr) {
    return [...new Set((arr || []).filter(Boolean))];
  }

  function formatJapaneseForm(j) {
    const word = (j?.word || '').trim();
    const reading = (j?.reading || '').trim();
    if (word && reading && word !== reading) {
      return `${word} 【${reading}】`;
    }
    return word || reading || '';
  }

  function collectKanjiFromForms(forms, fallbackWord = '') {
    const chars = new Set();
    (forms || []).forEach(form => {
      const source = form?.word || '';
      const matches = source.match(/[\u4e00-\u9faf]/g) || [];
      matches.forEach(ch => chars.add(ch));
    });
    if (chars.size === 0) {
      const matches = (fallbackWord || '').match(/[\u4e00-\u9faf]/g) || [];
      matches.forEach(ch => chars.add(ch));
    }
    return [...chars];
  }

  async function init() {
    if (typeof myWords !== 'undefined' && myWords) {
      rawWordList = myWords.split('\n').map(w => w.trim()).filter(Boolean);
    } else {
      rawWordList = ["政治", "努力", "経験", "成功", "歴史", "自然", "環境"];
    }

    startBackgroundAnimation();
    setupVisibilityObserver();

    await refreshForeground();
    setInterval(refreshForeground, 120000);
  }

  let bgSpawnInterval = null;
  let bgPaused = false;

  function startBackgroundAnimation() {
    spawnBgWord();
    bgSpawnInterval = setInterval(() => {
      if (!bgPaused) spawnBgWord();
    }, 5000);
  }

  function spawnBgWord() {
    if (rawWordList.length === 0 || currentBgWordCount >= MAX_BG_WORDS) return;

    const word = rawWordList[Math.floor(Math.random() * rawWordList.length)];
    const el = document.createElement('div');
    el.className = 'bg-word';
    el.innerText = word;

    const size = Math.random() * 6 + 2;
    el.style.fontSize = size + 'rem';
    el.style.top = (Math.random() * 90) + '%';
    el.style.opacity = (size / 10) * 0.12 + 0.04;

    currentBgWordCount++;
    document.getElementById('background').appendChild(el);

    setTimeout(() => {
      el.remove();
      currentBgWordCount--;
    }, 25000);
  }

  function setupVisibilityObserver() {
    document.addEventListener('visibilitychange', () => { bgPaused = document.hidden; });
    const mediaQuery = window.matchMedia('(display-mode: fullscreen)');
    mediaQuery.addEventListener?.('change', () => { bgPaused = false; });
  }

  // =========================================================
  // 3. MULTI-PROXY FETCHING SYSTEM (Stabilized & Load Balanced)
  // =========================================================
  const PROXY_TIMEOUT_MS = 8000;

  async function fetchWithProxy(targetUrl, isJson = true) {
    const proxies = [
      'https://api.allorigins.win/raw?url=',
      'https://corsproxy.io/?',
      'https://api.codetabs.com/v1/proxy?quest='
    ];

    // Shuffle proxies to balance load & bypass temporary rate blocks sequentially
    proxies.sort(() => Math.random() - 0.5);
    let lastError = new Error("All proxies failed.");

    for (const proxyUrl of proxies) {
      const fullUrl = proxyUrl + encodeURIComponent(targetUrl);
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), PROXY_TIMEOUT_MS);

      try {
        const res = await fetch(fullUrl, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const text = await res.text();

        if (isJson) {
          try {
            return JSON.parse(text);
          } catch (e) {
            throw new Error("Proxy returned invalid JSON (Likely a rate-limit HTML page)");
          }
        }
        return text;
      } catch (e) {
        clearTimeout(timeoutId);
        lastError = e;
        console.warn(`Proxy ${proxyUrl.split('/')[2]} failed: ${e.message}`);
      }
    }

    throw lastError;
  }

  // =========================================================
  // 4. JISHO WORD DETAILS
  // =========================================================
  async function fetchJishoWord(word, retryCount = 2) {
    if (dictionaryCache[word]) return dictionaryCache[word];

    let lastError;

    for (let attempt = 0; attempt <= retryCount; attempt++) {
      try {
        const apiUrl = 'https://jisho.org/api/v1/search/words?keyword=' + encodeURIComponent(word);
        
        let jisho;
        // Optimization: Try native fetch first. (If user has a CORS extension, this bypasses proxy limits entirely)
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 4000);
          const res = await fetch(apiUrl, { signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok) {
            jisho = await res.json();
          } else {
            throw new Error("Direct API fetch failed");
          }
        } catch (directErr) {
          // Fallback to proxy rotation
          jisho = await fetchWithProxy(apiUrl, true);
        }

        // Validate structure to ensure we didn't receive a JSON-formatted error page
        if (!jisho || typeof jisho !== 'object' || !Array.isArray(jisho.data)) {
          throw new Error('INVALID_API_RESPONSE'); 
        }

        if (jisho.data.length === 0) {
          throw new Error('JISHO_NOT_FOUND');
        }

        const entry = jisho.data[0];
        if (!entry) throw new Error('JISHO_NOT_FOUND');

        console.log(`✓ Fetched "${word}" successfully on attempt ${attempt + 1}`);

        const japaneseForms = entry.japanese || [];
        const senses = entry.senses || [];

        const kanji = japaneseForms.find(j => j.word)?.word || word;
        const reading = japaneseForms.find(j => j.reading)?.reading || japaneseForms[0]?.reading || '';

        const status = [];
        if (entry.is_common) status.push('common word');

        const jlptValue = Array.isArray(entry.jlpt) ? entry.jlpt[0] : entry.jlpt;
        if (jlptValue) status.push(`jlpt n${jlptValue.replace('jlpt-n', '')}`);

        if (Array.isArray(entry.tags) && entry.tags.length) {
          status.push(...entry.tags);
        }

        const meanings = senses.map(sense => ({
          pos: uniq(sense.parts_of_speech || []),
          defs: sense.english_definitions || [],
          info: uniq(sense.info || []),
          tags: uniq(sense.tags || []),
          restrictions: uniq(sense.restrictions || []),
          links: sense.links || [],
          seeAlso: uniq(sense.see_also || []),
          antonyms: uniq(sense.antonyms || [])
        }));

        const extraForms = uniq(japaneseForms.map(formatJapaneseForm).filter(Boolean));
        const notes = uniq(senses.flatMap(s => [...(s.info || []), ...(s.tags || []), ...(s.restrictions || [])]));
        const relatedKanji = collectKanjiFromForms(japaneseForms, word);

        const result = { kanji, reading, meanings, status, extraForms, notes, relatedKanji, japaneseForms };
        dictionaryCache[word] = result;
        return result;

      } catch (e) {
        lastError = e;

        if (e.message === 'JISHO_NOT_FOUND' || e.message === 'JISHO_NO_ENTRY') {
          const msg = e.message === 'JISHO_NOT_FOUND' ? `${word} — Not found in Jisho` : `${word} — No entry returned`;
          console.warn(msg);
          return {
            kanji: word, reading: "—",
            meanings: [{ pos: [], defs: [msg], info: [], tags: [], restrictions: [], links: [], seeAlso: [], antonyms: [] }],
            status: [], extraForms: [], notes: [],
            relatedKanji: collectKanjiFromForms([], word), japaneseForms: []
          };
        }

        if (attempt < retryCount) {
          const delay = 2500 * (attempt + 1);
          console.warn(`⏳ fetchJishoWord("${word}") attempt ${attempt + 1} failed (${e.message}). Retrying in ${delay}ms...`);
          await new Promise(r => setTimeout(r, delay));
        }
      }
    }

    console.error(`✗ fetchJishoWord("${word}") failed after ${retryCount + 1} attempts:`, lastError?.message || lastError);
    return {
      kanji: word, reading: "—",
      meanings: [{ pos: [], defs: ["Definition not found (network error)"], info: [], tags: [], restrictions: [], links: [], seeAlso: [], antonyms: [] }],
      status: [], extraForms: [], notes: [],
      relatedKanji: [], // Omit kanji checks on network error to prevent cascading proxy failure
      japaneseForms: []
    };
  }

  // =========================================================
  // 5. JISHO KANJI DETAILS
  // =========================================================
  async function fetchKanjiDetails(kanji) {
    if (kanjiCache[kanji]) return kanjiCache[kanji];

    try {
      const jishoUrl = 'https://jisho.org/search/' + encodeURIComponent(kanji) + '%20%23kanji';
      let htmlText;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(jishoUrl, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
            htmlText = await res.text();
        } else {
            throw new Error("Direct fetch failed");
        }
      } catch (err) {
        htmlText = await fetchWithProxy(jishoUrl, false);
      }

      if (!htmlText) throw new Error("No HTML returned");

      const doc = new DOMParser().parseFromString(htmlText, "text/html");

      const extractText = (selector) => {
        const el = doc.querySelector(selector);
        return el ? el.textContent.replace(/\s+/g, ' ').trim() : '';
      };

      const grade = extractText('.grade') || 'Grade Unlisted';
      const jlpt = extractText('.jlpt') || 'JLPT Unlisted';
      const frequency = extractText('.frequency') || '';
      const mainMeaning = extractText('.kanji-details__main-meanings') || extractText('.kanji-details__main-meanings-list') || '';

      const kun = Array.from(doc.querySelectorAll('.kun_yomi a')).map(a => a.textContent.trim()).filter(Boolean).join('、') || 'None';
      const on = Array.from(doc.querySelectorAll('.on_yomi a')).map(a => a.textContent.trim()).filter(Boolean).join('、') || 'None';

      const compounds = [];
      const allLis = doc.querySelectorAll('.row .span4 ul li');
      allLis.forEach(li => {
        if (compounds.length < 3) {
          let text = li.textContent.replace(/\s+/g, ' ').trim();
          if (text) compounds.push(text.replace('】', '】 - '));
        }
      });

      const result = { grade, jlpt, frequency, mainMeaning, kun, on, compounds };
      kanjiCache[kanji] = result;
      return result;
    } catch (e) {
      console.error("Failed to load Kanji:", kanji, e);
      return null;
    }
  }
  // =========================================================
  // OFFLINE CACHE SYSTEM
  // =========================================================
  const OFFLINE_CACHE_KEY = 'jisho_offline_cache';
  const MAX_OFFLINE_WORDS = 100;

  function saveToOfflineCache(word, wordData, kanjiResults) {
    try {
      // 1. Get existing cache
      let cache = JSON.parse(localStorage.getItem(OFFLINE_CACHE_KEY) || '[]');
      
      // 2. Remove the word if it's already in the cache (so we can move it to the front)
      cache = cache.filter(item => item.word !== word);
      
      // 3. Add the new successful fetch to the front
      cache.unshift({ word, wordData, kanjiResults });
      
      // 4. Prune if we exceed the max limit
      if (cache.length > MAX_OFFLINE_WORDS) {
        cache.pop();
      }
      
      // 5. Save back to localStorage
      localStorage.setItem(OFFLINE_CACHE_KEY, JSON.stringify(cache));
    } catch (e) {
      console.warn("Failed to save to offline cache. Storage might be full or blocked.", e);
    }
  }

  function getRandomFromOfflineCache() {
    try {
      const cache = JSON.parse(localStorage.getItem(OFFLINE_CACHE_KEY) || '[]');
      if (cache.length === 0) return null;
      
      // Pick a random entry from our saved history
      const randomIndex = Math.floor(Math.random() * cache.length);
      return cache[randomIndex];
    } catch (e) {
      console.warn("Failed to read from offline cache.", e);
      return null;
    }
  }
  // =========================================================
  // 6. RENDERERS
  // =========================================================
  function renderWordCard(wordData) {
    const statusHtml = wordData.status.length
      ? `<div class="meta-tags">${wordData.status.map(s => `<span class="meta-tag">${escapeHtml(s)}</span>`).join('')}</div>` : '';

    const meaningHtml = wordData.meanings.map((sense, idx) => {
      const pos = sense.pos.length ? escapeHtml(sense.pos.join(' · ')) : 'Meaning';
      const defs = escapeHtml(sense.defs.join('; '));
      const senseNotes = uniq([...sense.info, ...sense.tags, ...sense.restrictions, ...sense.seeAlso.map(x => `see also: ${x}`), ...sense.antonyms.map(x => `antonym: ${x}`)]);

      const linksHtml = sense.links.length
        ? `<div class="inline-list" style="margin-top:0.5rem;">${sense.links.map(l => `<span class="inline-chip">${escapeHtml(l.text || 'link')}</span>`).join('')}</div>` : '';

      return `
        <div class="sense">
          <div class="sense-pos">${idx + 1}. ${pos}</div>
          <div class="sense-defs">${defs}</div>
          ${senseNotes.length ? `<div class="sense-notes">${escapeHtml(senseNotes.join(' · '))}</div>` : ''}
          ${linksHtml}
        </div>`;
    }).join('');

    const formsHtml = wordData.extraForms.length
      ? `<div class="detail-section"><div class="detail-title">Other forms</div><div class="inline-list">
             ${wordData.extraForms.map(f => `<span class="inline-chip">${escapeHtml(f)}</span>`).join('')}
         </div></div>` : '';

    const notesHtml = wordData.notes.length
      ? `<div class="detail-section"><div class="detail-title">Notes</div><div class="inline-list">
             ${wordData.notes.map(n => `<span class="inline-chip">${escapeHtml(n)}</span>`).join('')}
         </div></div>` : '';

    return `
      <div class="main-card">
        <div class="reading">${escapeHtml(wordData.reading)}</div>
        <div class="kanji">${escapeHtml(wordData.kanji)}</div>
        ${statusHtml}
        <div class="detail-grid" style="margin-top:1.25rem;">
          <div class="detail-section"><div class="detail-title">Meaning</div>${meaningHtml}</div>
          ${formsHtml}${notesHtml}
        </div>
      </div>`;
  }

  function renderKanjiCard(kChar, kData) {
    if (!kData) return '';
    const compHtml = kData.compounds.length > 0
      ? kData.compounds.map(c => `<li style="margin-bottom:8px;">${escapeHtml(c)}</li>`).join('')
      : '<li>No common compounds</li>';

    return `
      <div class="k-card">
        <div class="k-char-title">${escapeHtml(kChar)}</div>
        <div class="k-stat">${escapeHtml(kData.grade)} | ${escapeHtml(kData.jlpt)}</div>
        <div class="k-freq">${escapeHtml(kData.frequency)}</div>
        ${kData.mainMeaning ? `<div class="k-section"><span class="k-label">Meaning:</span><span class="k-value">${escapeHtml(kData.mainMeaning)}</span></div>` : ''}
        <div class="k-section"><span class="k-label">Kun:</span><span class="k-value">${escapeHtml(kData.kun)}</span></div>
        <div class="k-section"><span class="k-label">On:</span><span class="k-value">${escapeHtml(kData.on)}</span></div>
        <div class="k-section" style="margin-top:1.5rem;"><span class="k-label">Compounds:</span><ul class="compounds-list">${compHtml}</ul></div>
      </div>`;
  }

  // =========================================================
  // 7. FOREGROUND RENDERER
  // =========================================================
  async function refreshForeground() {
    const fg = document.getElementById('foreground');
    const thisRefresh = ++refreshCounter;

    if (!hasRenderedOnce && !fg.innerHTML.trim()) {
      fg.innerHTML = '<div class="main-card"><div class="meaning" style="color:#666;">Searching Jisho...</div></div>';
    }

    try {
      if (!rawWordList.length) {
        if (!hasRenderedOnce) {
          fg.innerHTML = `<div class="main-card"><div class="meaning" style="color:#aaa;">No words available</div></div>`;
        }
        return;
      }

      const word = rawWordList[Math.floor(Math.random() * rawWordList.length)] || '';
      
      // 1. Fetch data
      const wordData = await fetchJishoWord(word);
      
      // If the network error fallback triggered inside fetchJishoWord, throw an error to trigger offline cache
      if (wordData.meanings[0].defs[0].includes("network error") || wordData.meanings[0].defs[0].includes("No entry")) {
        throw new Error("Network or API failure detected");
      }

      const kanjiList = uniq(wordData.relatedKanji);
      const kanjiResults = [];

      // Fetch kanjis sequentially
      for (let i = 0; i < kanjiList.length; i++) {
        if (i > 0) await new Promise(r => setTimeout(r, 450));
        kanjiResults.push(await fetchKanjiDetails(kanjiList[i]));
      }

      if (thisRefresh !== refreshCounter) return;

      // 2. Save successful fetch to offline cache
      saveToOfflineCache(word, wordData, kanjiResults);

      // 3. Render HTML
      let html = renderWordCard(wordData);
      if (kanjiList.length > 0) {
        html += `<div class="kanji-cards-container">`;
        kanjiResults.forEach((kData, idx) => {
          if (kData) html += renderKanjiCard(kanjiList[idx], kData);
        });
        html += `</div>`;
      }

      fg.innerHTML = html;
      hasRenderedOnce = true;

    } catch (err) {
      console.error("Foreground render failed, attempting to load from offline cache...", err);
      
      // ==========================================
      // OFFLINE CACHE FALLBACK
      // ==========================================
      const cachedItem = getRandomFromOfflineCache();
      
      if (cachedItem) {
        console.log(`Loaded "${cachedItem.word}" from local offline cache.`);
        if (thisRefresh !== refreshCounter) return;

        let html = renderWordCard(cachedItem.wordData);
        
        // Add an offline indicator so you know it's working
        html = html.replace('class="meta-tags">', 'class="meta-tags"><span class="meta-tag" style="background: rgba(200,50,50,0.3); border-color: #ff6b6b; color: #ff6b6b;">Offline Cache</span>');

        if (cachedItem.kanjiResults && cachedItem.kanjiResults.length > 0) {
          html += `<div class="kanji-cards-container">`;
          const kanjiList = uniq(cachedItem.wordData.relatedKanji);
          
          cachedItem.kanjiResults.forEach((kData, idx) => {
            if (kData) html += renderKanjiCard(kanjiList[idx], kData);
          });
          html += `</div>`;
        }

        fg.innerHTML = html;
        hasRenderedOnce = true;
      } else {
        // Only show the hard error if the network fails AND the cache is completely empty
        if (!hasRenderedOnce) {
          fg.innerHTML = `
            <div class="main-card">
              <div class="reading">Error</div>
              <div class="meaning">Could not load Jisho data and offline cache is empty. Please check your network.</div>
            </div>`;
        }
      }
    }
  }

  init();
</script>
</body>
</html>
