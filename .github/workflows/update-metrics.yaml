name: update-metrics

on:
  schedule:
    - cron: '0 3 * * 1'   # weekly update (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch script
        run: |
          python .github/scripts/fetch_metrics.py

      - name: Commit & push metrics (handles remote changes)
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          # Stage file (no error if missing)
          git add assets/data/metrics.json || true

          # Only continue if there's something to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update research metrics"

          # Determine current branch
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Current branch: $BRANCH"

          # Fetch remote branch if it exists
          git fetch origin $BRANCH || true

          # If origin/$BRANCH exists, try to rebase local commits on top of it
          if git show-ref --verify --quiet refs/remotes/origin/$BRANCH; then
            echo "Rebasing onto origin/$BRANCH"
            if ! git rebase origin/$BRANCH; then
              echo "Rebase failed — aborting rebase and falling back to merge"
              git rebase --abort || true
              git pull --no-edit origin $BRANCH
            fi
          else
            echo "Remote branch origin/$BRANCH does not exist — skipping rebase"
          fi

          # Push changes
          git push origin HEAD
