name: update-metrics

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is important to ensure git history is present
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch script
        run: |
          python .github/scripts/fetch_metrics.py

      - name: Commit & push metrics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update research metrics"
          file_pattern: "assets/data/metrics.json"
          # This ensures the action commits to the current branch
          branch: ${{ github.ref_name }}