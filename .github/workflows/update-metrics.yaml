name: update-metrics

on:
  schedule:
    - cron: '0 3 * * 1'   # weekly update (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetch script
        run: |
          python .github/scripts/fetch_metrics.py

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          # stage the metrics file if it exists (no error if missing)
          git add assets/data/metrics.json || true

          # if there are staged changes, commit and push; otherwise do nothing
          git diff --cached --quiet || (git commit -m "Update research metrics" && git push)
